name: Update outage schedule

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      retry_failed:
        description: "Заново розібрати раніше відхилені зображення"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: MagProtector/chernihiv-oblast_parser
          token: ${{ secrets.CODE_TOKEN }}
          path: code
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt

      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install Python deps
        run: pip install -r code/requirements.txt

      - name: Fetch and parse new schedules
        id: parse
        env:
          TG_CHANNEL: ${{ vars.TG_CHANNEL || 'chernigivoblenergo' }}
          RETRY_FAILED: ${{ inputs.retry_failed && '1' || '0' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          BACKUP_URL: ${{ vars.BACKUP_URL }}
        run: python code/fetch_and_parse.py

      - name: Commit data
        if: always()
        run: |
          git config user.name  "schedule-bot"
          git config user.email "schedule-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update schedule" && git push)

      - name: Notify in Telegram on failure
        if: failure() && steps.parse.outcome == 'failure'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="$TG_CHAT_ID" \
              -d text="⚠️ Не вдалося розібрати новий графік. Перевірте: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
